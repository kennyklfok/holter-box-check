<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Holter Box Check</title>
  </head>
  <body>
    <div id="app">
      <main id="login-view" class="lock-screen">
        <section class="passcode-card" aria-labelledby="login-title">
          <h1 id="login-title">Holter box</h1>
          <form id="login-form">
            <label for="passcode">Passcode</label>
            <input id="passcode" name="passcode" type="password" autocomplete="off" required maxlength="256" autofocus />
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button id="login-submit" class="primary-button" type="submit">Enter</button>
          </form>
        </section>
      </main>

      <div id="staff-view" hidden>
        <header class="topbar">
          <strong>Holter box</strong>
          <div class="menu-wrap">
            <button id="menu-button" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu-panel"><span></span><span></span><span></span></button>
            <nav id="menu-panel" class="menu-panel" aria-label="Menu" hidden>
              <button data-view="dashboard" type="button">Box status</button>
              <button data-view="history" type="button">See history</button>
            </nav>
          </div>
        </header>

        <main class="content-area">
          <section id="dashboard-view" class="dashboard-view" aria-labelledby="dashboard-title">
            <div id="success-message" class="success-banner" role="status" hidden>Check recorded.</div>
            <div id="latest-content" class="latest-content" aria-live="polite"></div>
            <button id="open-check" class="check-button" type="button">I checked the box</button>
          </section>

          <section id="history-view" class="history-view" aria-labelledby="history-title" hidden>
            <h1 id="history-title">History</h1>
            <div id="history-list" class="history-list"></div>
            <p id="history-error" class="form-error" role="alert" hidden></p>
            <button id="load-more" class="load-more" type="button" hidden>Load more</button>
          </section>
        </main>
      </div>
    </div>

    <dialog id="check-dialog" class="check-dialog" aria-labelledby="dialog-title">
      <form id="check-form" method="dialog">
        <button id="dialog-close" class="dialog-close" type="button" aria-label="Close">×</button>
        <h2 id="dialog-title">Confirm check</h2>
        <label for="staff-name">Initials or name</label>
        <input id="staff-name" name="staff-name" type="text" maxlength="60" autocomplete="off" required />
        <p class="input-help">Do not enter patient information.</p>
        <p id="check-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions"><button id="dialog-cancel" class="secondary-button" type="button">Cancel</button><button id="check-submit" class="primary-button" type="submit">Confirm check</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
